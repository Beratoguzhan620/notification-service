# One command: docker compose up --build
# API reference: http://localhost:8080/scalar · Mail: http://localhost:8025 · RabbitMQ: http://localhost:15672 · Traces: http://localhost:16686
# The admin key is ADMIN_API_KEY (a local default below; override it in .env).
name: notification-service

x-database: &database "Host=db;Database=notifications;Username=notifications;Password=${POSTGRES_PASSWORD:-notifications-local}"
x-rabbitmq: &rabbitmq "amqp://notifications:${RABBITMQ_PASSWORD:-rabbit-local}@rabbitmq:5672/"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifications-local}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: notifications
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit-local}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Catches every email; nothing leaves the machine. Chaos mode lets the end-to-end flow make it refuse mail.
  mailpit:
    image: axllent/mailpit:v1.30.2
    environment:
      MP_ENABLE_CHAOS: "true"
    ports:
      - "8025:8025"

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    ports:
      - "16686:16686"

  api:
    build:
      context: .
      args:
        PROJECT: NotificationService.Api
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Notifications: *database
      Database__MigrateOnStartup: "true"
      Bootstrap__AdminApiKey: ${ADMIN_API_KEY:-ns_localadm_local-admin-key-change-me-in-the-env-file}
      Bootstrap__SampleTemplates: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8080:8080"

  # Two workers share the delivery queue, to show that every message is handled once.
  worker:
    build:
      context: .
      args:
        PROJECT: NotificationService.Worker
    restart: on-failure
    deploy:
      replicas: 2
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Notifications: *database
      ConnectionStrings__RabbitMq: *rabbitmq
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

volumes:
  db-data:
  rabbitmq-data:
