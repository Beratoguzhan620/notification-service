name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NotificationService.slnx

      - name: Build
        run: dotnet build NotificationService.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/NotificationService.UnitTests/NotificationService.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Integration tests (PostgreSQL and RabbitMQ in Testcontainers)
        run: dotnet test tests/NotificationService.IntegrationTests/NotificationService.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check for model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations has-pending-model-changes --project src/NotificationService.Infrastructure --startup-project src/NotificationService.Api --no-build --configuration Release

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Check the API and the workers
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/health/ready | grep -q "Healthy"
          test "$(docker compose ps --status running --quiet worker | wc -l)" = "2"

          key=ns_localadm_local-admin-key-change-me-in-the-env-file
          curl -sf http://localhost:8080/api/clients/me -H "X-Api-Key: $key" | jq -e '.role == "Admin"' > /dev/null
          for w in $(docker compose ps --quiet worker); do
            docker exec "$w" bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && cat <&3' | grep -q Healthy
          done
          echo "API and two workers are up."

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
